<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Meditation Statistics</title>
	<link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
	<div class="app-container"> 
            <header>
                <h1>Statistics</h1>
                <div class="controls-container">
                    <select id="duration-select" class="stat-select">
                        <option class="stat-buttons">Day</option>
                        <option class="stat-buttons">Week</option>
                        <option class="stat-buttons">Month</option>
                        <option class="stat-buttons">Year</option>
                    </select>
                    <select id="comparator-select">
                        <option class="stat-buttons">OD</option>
                        <option class="stat-buttons">OW</option>
                        <option class="stat-buttons">OM</option>
                        <option class="stat-buttons">OY</option>
                    </select>
                </div>
            </header>
            <main>
                <canvas id="meditationChart"></canvas>
		</main>
		<footer>
            <a href="index.html" class="nav-btn">Back</a>
            <p class="nav-btn" id="meditation-hours">Lifetime:</p>
		</footer>
	</div>
		<script src="script.js"></script> 
</body>
</html>
