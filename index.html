<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>Vipassana Meditation App</title>
	<link href="style.css" rel="stylesheet">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon.jpg">
	<meta name="theme-color" content="#4CAF50">
</head>
<body>
	<div class="app-container"> 
		<header id="ios-install-banner">
				<p>To install this app for easy meditation access, tap the 3 dots at the bottom, click "Share", click "View More", click "Add to Home Screen"</p>
		</header>
		<main>
			<h1>Vipassana Meditation App</h1>
			<div class="timer">
				30:00
			</div>
			<label>
				<input type="checkbox" id="chime-toggle"> No Chanting
			</label>
		</main>
		<footer class="controls">
				<button class="start-btn">Start</button>
				<button class="stop-btn">Stop</button>
				<button class="history-btn">History</button>
				<pre class="history"></pre>
		</footer>
	</div>
		<script src="script.js"></script> 
</body>
</html>
